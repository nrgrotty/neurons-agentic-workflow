services:
  - type: web
    name: neurons-agentic-workflow
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install poetry && poetry install --only main
    startCommand: poetry run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POETRY_VERSION
        value: 2.3.2