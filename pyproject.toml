[project]
name = "neurons_agentic_workflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Neus Rodeja Ferrer"}
]
readme = "README.md"
requires-python = "<3.14,>=3.10"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "langgraph (>=1.1.3,<2.0.0)",
    "langchain-google-genai (>=4.2.1,<5.0.0)",
    "langsmith (>=0.7.22,<0.8.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "streamlit (>=1.55.0,<2.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "requests (>=2.33.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
