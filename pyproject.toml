[project]
name = "neurons_agentic_workflow"
version = "0.1.0"
description = ""
authors = [
    {name = "Neus Rodeja Ferrer"}
]
readme = "README.md"
requires-python = "<4.0,>=3.10"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "pydantic-ai (>=1.73.0,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-ai-slim[google] (>=1.73.0,<2.0.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
